################################################################
#### project config ####
################################################################

[project]
name = "brainscore_language"
version = "2.2.1"
description = ""
authors = []
license = { 'file' = 'LICENSE' }
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "tqdm",
    "numpy <2",
    "brainscore-core",
    "fire",
    # brainscore_language/data/wikitext imports this at load time; without it the
    # language data path raises ModuleNotFoundError. Declared here rather than only in
    # the conda environment file, so a plain `pip install -e ./language` is sufficient.
    "datasets",
    # Unified installs use sklearn 1.5.x. Language features that require
    # sklearn >=1.6 are unsupported in the shared unified environment.
    "scikit-learn>=1.5,<1.6",
    "pandas <3",
    # model_helpers dependencies
    "torch >=1.9.1",
    "transformers>=4.57,<6",
    "gensim",
    "joblib",
    # submission dependencies
    "requests"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-check <=1.3.0",
]

[build-system]
requires = [
    "setuptools >=65",
    "wheel"
]


################################################################
#### mypy type-checking config ####
################################################################

[tool.mypy]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]

markers = [
    "memory_intense",
    "travis_slow",
    "slow",
    "private_access",
]


################################################################
#### setuptools packaging config ####
################################################################

[tool.setuptools.package-data]
# include non-python files (e.g. 'requirements.txt') in package install
"brainscore_language.benchmarks" = ["**"]
"brainscore_language.data" = ["**"]
"brainscore_language.metrics" = ["**"]
"brainscore_language.models" = ["**"]
