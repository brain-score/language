################################################################
#### project config ####
################################################################

[project]
name = "brainscore_language"
version = "2.2.1"
description = ""
authors = []
license = { 'file' = 'LICENSE' }
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "tqdm",
    "numpy <2",
    "brainscore-core",
    "fire",
    "scikit-learn >=1.6", # for metric_helpers/transformations.py cross-validation
    "pandas <3",
    # model_helpers dependencies
    "torch >=1.9.1",
    "transformers >=4.51,<5",
    "gensim",
    "joblib",
    # submission dependencies
    "requests"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-check <=1.3.0",
]

[build-system]
requires = [
    "setuptools >=65",
    "wheel"
]


################################################################
#### version management config ####
################################################################

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version} [skip ci]"
build_command = "python -m pip install build && python -m build"

[tool.semantic_release.branches.main]
match = "main"

################################################################
#### mypy type-checking config ####
################################################################

[tool.mypy]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = [
    "tests"
]

filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning"
]

markers = [
    "memory_intense",
    "travis_slow",
    "slow",
    "private_access",
]


################################################################
#### setuptools packaging config ####
################################################################

[tool.setuptools.package-data]
# include non-python files (e.g. 'requirements.txt') in package install
"brainscore_language.benchmarks" = ["**"]
"brainscore_language.data" = ["**"]
"brainscore_language.metrics" = ["**"]
"brainscore_language.models" = ["**"]
