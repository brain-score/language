name: UMI v2
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [unified-model-interface-v2]
  push:
    branches: [unified-model-interface-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordinated:
    name: UMI v2
    # Update the workflow and runner revision together.
    uses: KartikP/brainscore-unified/.github/workflows/offline-tests.yml@3828ef9a1bc4691bdd2adb265949e2cb8d343b0e
    with:
      candidate: language
      candidate_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      candidate_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      unified_revision: 3828ef9a1bc4691bdd2adb265949e2cb8d343b0e
